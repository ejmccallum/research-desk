name: Mac standalone readiness
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --publish never --mac --arm64 --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: |
          if [ "$(uname -m)" = arm64 ]; then app='release/mac-arm64/Research Desk.app/Contents/MacOS/Research Desk'; else app='release/mac/Research Desk.app/Contents/MacOS/Research Desk'; fi
          node scripts/readiness.mjs "$app" local '${{ runner.temp }}/readiness'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-readiness-results
          path: ${{ runner.temp }}/readiness
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: release/*.dmg
